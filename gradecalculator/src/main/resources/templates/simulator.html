<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Simulator - GradeCalc</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #4f46e5; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #111827; --text-muted: #6b7280; --sidebar-width: 260px; --border-color: #e5e7eb; --success: #10b981; }
        [data-theme="dark"] { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f3f4f6; --text-muted: #94a3b8; --border-color: #334155; }
        
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); margin: 0; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: var(--sidebar-width); background-color: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 24px; }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; border-radius: 8px; margin-bottom: 8px; font-weight: 500; transition:0.2s;}
        .nav-link:hover, .nav-link.active { background-color: rgba(79, 70, 229, 0.1); color: var(--primary); }
        .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 20px; margin-top: auto; }
        
        /* MAIN CONTENT */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; display:flex; flex-direction:column; align-items:center; }
        .container { width: 100%; max-width: 900px; }

        .selector-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        select { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); flex: 1; font-size: 14px; background: var(--bg-color); color: var(--text-main); }
        
        .sim-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .grade-pill { background: var(--primary); color: white; padding: 10px 25px; border-radius: 50px; font-weight: 800; font-size: 22px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }

        .group-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; overflow: hidden; }
        .group-header { padding: 15px 20px; background: rgba(0,0,0,0.02); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .group-content { padding: 15px 20px; }
        
        .assign-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; transition: 0.3s; }
        .assign-name { flex: 2; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; background: transparent; color: var(--text-main); font-size: 13px; }
        .assign-score { flex: 0.8; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; text-align: center; background: transparent; color: var(--text-main); font-weight: 600; }
        .assign-total { flex: 0.5; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; text-align: center; background: rgba(0,0,0,0.05); color: var(--text-muted); cursor: not-allowed; font-size: 12px; }
        
        .btn-add { background: none; border: 1px dashed var(--border-color); color: var(--text-muted); width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn-add:hover { border-color: var(--primary); color: var(--primary); background: rgba(79, 70, 229, 0.05); }

        .dropped { text-decoration: line-through; opacity: 0.4; filter: grayscale(1); }
        .not-graded { opacity: 0.5; font-style: italic; }

        @media (max-width: 768px) { .sidebar { display:none; } .main-content { padding:20px; } }
    </style>
</head>
<body data-theme="light">

    <aside class="sidebar">
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i> GradeCalc</div>
        <nav>
            <a th:href="@{/index}" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a th:href="@{/simulator}" class="nav-link active"><i class="fa-solid fa-flask"></i> Grade Simulator</a>
            <a th:href="@{/target-calculator}" class="nav-link"><i class="fa-solid fa-bullseye"></i> Target Calculator</a>
        </nav>

        <div class="sidebar-footer">
            <div style="display: flex; justify-content: space-around; margin-bottom: 15px;">
                <button onclick="toggleTheme()" title="Toggle Theme" style="background:none; border:none; cursor:pointer; color:var(--text-muted);">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>
                <a th:href="@{/settings}" title="Account Settings" style="color:var(--text-muted);">
                    <i class="fa-solid fa-gear"></i>
                </a>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" title="Logout" style="background:none; border:none; cursor:pointer; color:var(--text-muted);">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </form>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); text-align: center;">
                Signed in as <br><strong th:text="${#authentication.name}">User</strong>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="container">
            <h1 style="margin-top:0;">Grade Simulator 🧪</h1>
            <p style="color:var(--text-muted); margin-bottom:20px;">Test hypothetical scenarios. Only assignments with scores (or edited by you) affect the grade.</p>

            <div class="selector-card">
                <i class="fa-solid fa-book" style="color:var(--text-muted);"></i>
                <select id="subjectSelect" onchange="loadSubject()">
                    <option value="" disabled selected>Select a subject to simulate...</option>
                    <th:block th:each="sub : ${subjects}">
                        <option th:value="${sub.id}" th:text="${sub.subjectName}">Math 101</option>
                    </th:block>
                </select>
            </div>

            <div id="simulationArea" style="display:none;">
                <div class="sim-header">
                    <div>
                        <div style="font-size:12px; text-transform:uppercase; color:var(--text-muted); letter-spacing: 0.5px;">Simulated Grade</div>
                        <div id="simulatedGradeText" style="font-size:14px; color:var(--text-muted);">--</div>
                    </div>
                    <div class="grade-pill" id="bigGradePill">0.00%</div>
                </div>

                <div id="groupsContainer">
                    </div>
            </div>
        </div>
    </main>

    <script>
        let currentSubject = null;

        // Initialize Theme
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
        }

        async function loadSubject() {
            const id = document.getElementById('subjectSelect').value;
            const res = await fetch(`/api/simulator/load?subjectId=${id}`);
            if(!res.ok) return;
            currentSubject = await res.json();
            renderSimulator();
        }

        function renderSimulator() {
            const container = document.getElementById('groupsContainer');
            container.innerHTML = "";
            document.getElementById('simulationArea').style.display = 'block';

            currentSubject.components.forEach((comp, index) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'group-card';
                
                let dropBadge = comp.dropLowest > 0 
                    ? `<span style="font-size:10px; background:#fee2e2; color:#991b1b; padding:2px 6px; border-radius:4px; margin-left:10px;">Drops Lowest ${comp.dropLowest}</span>` 
                    : '';

                groupDiv.innerHTML = `
                    <div class="group-header">
                        <span>${comp.name} ${dropBadge}</span>
                        <span style="font-size:12px; color:var(--text-muted)">${comp.weight}% Weight</span>
                    </div>
                    <div class="group-content" id="group-content-${index}"></div>
                    <div style="padding:0 20px 20px 20px;">
                        <button class="btn-add" onclick="addMockAssignment(${index})">+ Add Mock Assignment</button>
                    </div>
                `;
                container.appendChild(groupDiv);
                const contentDiv = groupDiv.querySelector(`#group-content-${index}`);
                
                comp.assignments.forEach(assign => {
                    contentDiv.appendChild(createAssignmentRow(assign.name, assign.score, assign.totalPoints));
                });
            });
            recalculateSimulation();
        }

        function createAssignmentRow(name, score, total, isNew = false) {
            const div = document.createElement('div');
            div.className = 'assign-row';
            // Only consider it "graded" initially if score > 0. If 0, student must edit to count it.
            if (score === 0 && !isNew) div.classList.add('not-graded');
            if (isNew) div.setAttribute('data-modified', 'true');

            div.innerHTML = `
                <input type="text" class="assign-name" value="${name}" placeholder="Name">
                <input type="number" class="assign-score" value="${score}" oninput="handleScoreEdit(this)" placeholder="Score">
                <input type="number" class="assign-total" value="${total}" readonly>
            `;
            return div;
        }

        function handleScoreEdit(input) {
            const row = input.closest('.assign-row');
            row.setAttribute('data-modified', 'true');
            row.classList.remove('not-graded');
            recalculateSimulation();
        }

        function addMockAssignment(groupIndex) {
            const contentDiv = document.getElementById(`group-content-${groupIndex}`);
            contentDiv.appendChild(createAssignmentRow("Hypothetical", 100, 100, true));
            recalculateSimulation();
        }

        function recalculateSimulation() {
            if(!currentSubject) return;
            let totalWeightUsed = 0;
            let weightedScoreSum = 0;

            currentSubject.components.forEach((comp, index) => {
                const container = document.getElementById(`group-content-${index}`);
                const rows = Array.from(container.querySelectorAll('.assign-row'));

                let assignments = rows.map(r => {
                    const s = parseFloat(r.querySelector('.assign-score').value);
                    const t = parseFloat(r.querySelector('.assign-total').value);
                    const isModified = r.getAttribute('data-modified') === 'true';
                    
                    // Logic: Ignore if Score is 0 UNLESS user manually touched it
                    if(isNaN(s) || isNaN(t) || t === 0 || (s === 0 && !isModified)) return null;
                    return { s, t, percent: (s/t), row: r };
                }).filter(a => a !== null);

                // Reset visuals
                assignments.forEach(a => { a.row.classList.remove('dropped'); a.row.style.opacity = "1"; });

                // Sort and Drop
                assignments.sort((a, b) => a.percent - b.percent);
                const dropCount = comp.dropLowest || 0;
                for(let i=0; i < Math.min(dropCount, assignments.length - 1); i++) {
                    assignments[i].row.classList.add('dropped');
                }

                const kept = assignments.filter(a => !a.row.classList.contains('dropped'));
                let gScore = 0; let gTotal = 0;
                kept.forEach(a => { gScore += a.s; gTotal += a.t; });

                if(gTotal > 0) {
                    weightedScoreSum += (gScore / gTotal) * comp.weight;
                    totalWeightUsed += comp.weight;
                }
            });

            const final = totalWeightUsed > 0 ? (weightedScoreSum / totalWeightUsed) * 100 : 0;
            document.getElementById('bigGradePill').innerText = final.toFixed(2) + '%';
            document.getElementById('simulatedGradeText').innerText = `Calculated using ${totalWeightUsed.toFixed(0)}% of category weights`;
        }
    </script>
</body>
</html>
