<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Old Subject - Grade Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #4f46e5; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #111827; --text-muted: #6b7280; --sidebar-width: 260px; --border-color: #e5e7eb; --danger: #ef4444; }
        [data-theme="dark"] { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f3f4f6; --text-muted: #94a3b8; --border-color: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); margin: 0; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s ease; }
        .sidebar { width: var(--sidebar-width); background-color: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 24px; z-index: 50; transition: transform 0.3s ease; }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; border-radius: 8px; margin-bottom: 8px; font-weight: 500; transition: all 0.2s; }
        .nav-link:hover, .nav-link.active { background-color: rgba(79, 70, 229, 0.1); color: var(--primary); }
        .spacer { flex: 1; }
        .user-profile { padding-top: 20px; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .icon-btn { cursor: pointer; color: var(--text-muted); transition: 0.2s; font-size: 16px; background: none; border: none; padding: 5px; }
        .icon-btn:hover { color: var(--primary); }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; }
        .form-container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 40px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid var(--border-color); margin-top: 20px; }
        .page-header { margin-bottom: 30px; text-align: center; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .page-subtitle { color: var(--text-muted); font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; box-sizing: border-box; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); }
        .btn-submit { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; transition: 0.2s; margin-top: 10px; }
        .row { display: flex; gap: 20px; } .col { flex: 1; }

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(2px); align-items: center; justify-content: center; }
        .modal-content { background-color: var(--card-bg); padding: 30px; border-radius: 16px; width: 450px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-save { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; margin-top:10px;}

        .mobile-nav { display: none; }
        .mobile-overlay { display: none; }
        .mobile-close-sidebar { display: none; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .mobile-nav { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
            .sidebar { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); width: 260px; box-shadow: 0 0 15px rgba(0,0,0,0.1); z-index: 999; }
            .sidebar.active { transform: translateX(0); }
            .mobile-close-sidebar { display: block; position: absolute; top: 20px; right: 20px; font-size: 24px; color: var(--text-muted); cursor: pointer; }
            .main-content { padding: 15px; width: 100%; box-sizing: border-box; }
            .form-container { padding: 20px; margin-top: 0; }
            .row { flex-direction: column; gap: 0; }
            .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 900; }
            .mobile-overlay.active { display: block; }
        }
    </style>
</head>
<body>

    <div class="mobile-nav">
        <div style="display:flex; align-items:center; gap:15px;">
            <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars" style="font-size:20px;"></i></button>
            <div class="logo" style="margin:0; font-size:18px;"><i class="fa-solid fa-graduation-cap"></i> GradeCalc</div>
        </div>
        <div style="display:flex; gap:15px;">
            <button class="icon-btn" id="themeBtnMobile" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
            <button class="icon-btn" onclick="openGlobalSettings()"><i class="fa-solid fa-gear"></i></button>
            <form action="/logout" method="post" style="margin:0;"><button class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></button></form>
        </div>
    </div>

    <div class="mobile-overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar">
        <div class="mobile-close-sidebar" onclick="toggleSidebar()">&times;</div>
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i> GradeCalc</div>
        <nav>
            <a href="index.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="add-subject.html" class="nav-link active"><i class="fa-solid fa-plus-circle"></i> Add Old Subjects</a>
            <a href="/simulator" class="nav-link"><i class="fa-solid fa-flask"></i> Grade Simulator</a>
            <a href="target-grade.html" class="nav-link"><i class="fa-solid fa-bullseye"></i> Target Calculator</a>
        </nav>
        <div class="spacer"></div>
        <div class="user-profile">
            <span style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:5px;">Signed in as <strong sec:authentication="name" style="color:var(--text-main)">Student</strong></span>
            <div style="display:flex; gap:10px; align-items:center;">
                <button class="icon-btn" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
                <button class="icon-btn" onclick="openGlobalSettings()"><i class="fa-solid fa-gear"></i></button>
                <form action="/logout" method="post" style="margin:0;"><button class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></button></form>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="form-container">
            <div class="page-header">
                <div class="page-title">Add Old Subject</div>
                <div class="page-subtitle">Add a class from a past semester to build your transcript.</div>
            </div>

            <form id="addSubjectForm">
                <input type="hidden" name="status" value="Completed">
                
                <div class="form-group"><label>Subject Name</label><input type="text" name="name" placeholder="e.g. DATA STRUCTURES" required style="text-transform:uppercase;"></div>
                <div class="row">
                    <div class="col form-group"><label>Course Code</label><input type="text" name="code" placeholder="e.g. CS400" required></div>
                    <div class="col form-group"><label>Credits</label><input type="number" name="credits" placeholder="e.g. 3" min="1" max="10" required></div>
                </div>
                
                <div class="row">
                    <div class="col form-group">
                        <label>Term Season</label>
                        <select name="termSeason" required>
                            <option value="Fall">Fall</option>
                            <option value="Spring">Spring</option>
                            <option value="Summer">Summer</option>
                        </select>
                    </div>
                    <div class="col form-group">
                        <label>Term Year</label>
                        <input type="number" name="termYear" id="termYearInput" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Final Grade Achieved</label>
                    <select name="letterGrade" required>
                        <option value="A">A (4.0)</option>
                        <option value="AB">AB (3.5)</option>
                        <option value="B">B (3.0)</option>
                        <option value="BC">BC (2.5)</option>
                        <option value="C">C (2.0)</option>
                        <option value="D">D (1.0)</option>
                        <option value="F">F (0.0)</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-submit">Add to Transcript <i class="fa-solid fa-check"></i></button>
            </form>
        </div>
    </main>

    <div id="globalSettingsModal" class="modal" onclick="if(event.target.id==='globalSettingsModal') this.style.display='none'">
        <div class="modal-content" style="width: 500px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header"><h2 class="modal-title">Account Settings</h2><span class="close-btn" style="cursor:pointer;" onclick="document.getElementById('globalSettingsModal').style.display='none'">&times;</span></div>
            
            <div style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);">
                <h4 style="margin: 0 0 10px 0; color: var(--text-main);">Profile Details</h4>
                <label style="display:block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-muted);">Username</label>
                <input type="text" id="settings-username" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); margin-bottom: 10px; box-sizing: border-box;">
                
                <label style="display:block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-muted);">Email</label>
                <input type="email" id="settings-email" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); margin-bottom: 10px; box-sizing: border-box;">
                
                <button class="btn-save" onclick="saveProfileChanges()">Save Profile Changes</button>
            </div>

            <div style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);">
                <h4 style="margin: 0 0 10px 0; color: var(--text-main);">Change Password</h4>
                <label style="display:block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-muted);">Current Password</label>
                <input type="password" id="settings-old-password" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); margin-bottom: 10px; box-sizing: border-box;">
                
                <label style="display:block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-muted);">New Password</label>
                <input type="password" id="settings-new-password" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); margin-bottom: 10px; box-sizing: border-box;">
                
                <button class="btn-save" onclick="updatePassword()">Reset Password</button>
            </div>

            <div style="margin-bottom:15px;">
                <h4 style="margin: 0 0 10px 0; color: var(--text-main);">Canvas Sync</h4>
                <label style="display:block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-muted);">Canvas API Token</label>
                <input type="text" id="canvasApiToken" readonly style="width:100%; padding:10px; border-radius:8px; background:var(--bg-color); color:var(--text-main); box-sizing: border-box; margin-bottom:10px;">
                <button class="btn-save" style="margin-top:0;" onclick="resetCanvasToken()">Regenerate Token</button>
            </div>
            
            <button class="btn-save" style="background:#fee2e2; color:#991b1b; border:1px solid #fecaca; margin-top: 10px;" onclick="confirm('Are you sure you want to delete your account? This cannot be undone.')">Delete Account</button>
        </div>
    </div>

<script>
    document.getElementById('termYearInput').value = new Date().getFullYear();

    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); updateIcons(false); }
        else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); updateIcons(true); }
    }
    function updateIcons(isDark) {
        const iconClass = isDark ? 'fa-sun' : 'fa-moon';
        document.getElementById('themeBtn').querySelector('i').className = `fa-solid ${iconClass}`;
        if(document.getElementById('themeBtnMobile')) document.getElementById('themeBtnMobile').querySelector('i').className = `fa-solid ${iconClass}`;
    }
    if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); updateIcons(true); }
    
    // UPDATE: Added loading User Profile functions
    function openGlobalSettings() { document.getElementById('globalSettingsModal').style.display = 'flex'; loadCanvasToken(); loadUserProfile(); }
    async function loadCanvasToken() { const r = await fetch('/api/account/token'); const d = await r.json(); document.getElementById('canvasApiToken').value = d.token; }
    async function resetCanvasToken() { const r = await fetch('/api/account/token/reset', {method:'POST'}); const d = await r.json(); document.getElementById('canvasApiToken').value = d.token; }

    async function loadUserProfile() {
        try {
            const res = await fetch('/api/user/profile');
            if(res.ok) {
                const data = await res.json();
                document.getElementById('settings-username').value = data.username || '';
                document.getElementById('settings-email').value = data.email || '';
            }
        } catch(e) { console.error(e); }
    }

    async function saveProfileChanges() {
        const username = document.getElementById('settings-username').value;
        const email = document.getElementById('settings-email').value;
        try {
            const res = await fetch('/api/user/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email })
            });
            const data = await res.json();
            if (res.ok) alert(data.message || 'Profile updated successfully!');
            else alert(data.error || 'Failed to update profile.');
        } catch (err) { console.error(err); alert('Error updating profile'); }
    }

    async function updatePassword() {
        const oldPassword = document.getElementById('settings-old-password').value;
        const newPassword = document.getElementById('settings-new-password').value;
        if (!oldPassword || !newPassword) return alert('Please fill in both password fields.');
        try {
            const res = await fetch('/api/user/password', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ oldPassword, newPassword })
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message || 'Password updated successfully!');
                document.getElementById('settings-old-password').value = '';
                document.getElementById('settings-new-password').value = '';
            } else alert(data.error || 'Failed to update password.');
        } catch (err) { console.error(err); alert('Error updating password'); }
    }

    function toggleSidebar() { document.querySelector('.sidebar').classList.toggle('active'); document.querySelector('.mobile-overlay').classList.toggle('active'); }

    document.getElementById('addSubjectForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        fetch('/api/subjects/add', { method: 'POST', body: formData })
        .then(response => { if (!response.ok) throw new Error("Failed"); return response.json(); })
        .then(() => { window.location.href = `/`; }) 
        .catch(error => { console.error(error); alert("Error creating subject."); });
    });
</script>
</body>
</html>
