<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Grade Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Shared Core Theme Configuration */
        :root { --primary: #4f46e5; --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f3f4f6; --text-muted: #94a3b8; --border-color: #334155; }
        [data-theme="light"] { --primary: #4f46e5; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #111827; --text-muted: #6b7280; --border-color: #e5e7eb; }
        [data-theme="badger"] { --primary: #c5050c; --bg-color: #000000; --card-bg: #171717; --text-main: #ffffff; --text-muted: #a1a1aa; --border-color: #333333; }
        [data-theme="ocean"] { --primary: #0284c7; --bg-color: #082f49; --card-bg: #0c4a6e; --text-main: #f0f9ff; --text-muted: #7dd3fc; --border-color: #0369a1; }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: var(--text-main); transition: background-color 0.3s ease; }

        /* Fix for input text visibility in all dark variants */
        input { background-color: var(--bg-color) !important; color: var(--text-main) !important; border-color: var(--border-color) !important; }
        
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .card { background: var(--card-bg); padding: 40px; border-radius: 16px; width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; border: 1px solid var(--border-color); }
        h1 { margin-bottom: 8px; font-weight: 700; font-size: 24px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }
        input { width: 100%; padding: 12px 16px; margin: 8px 0; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; transition: all 0.2s; font-family: 'Inter', sans-serif; }
        input:focus { border-color: var(--primary) !important; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .password-container { position: relative; width: 100%; margin-bottom: 5px; }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); font-size: 14px; }
        .remember-me-container { text-align: left; margin: 10px 0 20px 0; font-size: 14px; display: flex; align-items: center; }
        .remember-me-container input { width: 16px; height: 16px; margin-right: 8px; accent-color: var(--primary); cursor: pointer; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; transition: background-color 0.2s; }
        button:hover { opacity: 0.9; }
        .error { background-color: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; display: none; border: 1px solid #ef4444; }
        a { display: block; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 14px; transition: color 0.2s; }
        a:hover { color: var(--primary); }

        /* Dropdown UI */
        .theme-dropdown-container { position: absolute; top: 20px; right: 20px; }
        .theme-toggle { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: var(--text-main); font-size: 18px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .theme-toggle:hover { transform: scale(1.1); }
        .theme-dropdown { position: absolute; right: 0; top: 100%; margin-top: 10px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 160px; z-index: 1000; opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.2s ease; text-align: left; }
        .theme-dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .theme-dropdown-header { font-size: 11px; font-weight: 800; color: var(--text-muted); padding: 12px 16px 8px; text-transform: uppercase; letter-spacing: 1px; }
        .theme-option { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-main); transition: 0.2s; }
        .theme-option:hover { background: rgba(128,128,128,0.1); color: var(--primary); }
        .theme-option:last-child { border-radius: 0 0 8px 8px; margin-bottom: 5px; }
        .active-indicator { display: none; color: var(--primary); font-size: 14px; }
    </style>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

    <div class="theme-dropdown-container">
        <button class="theme-toggle" onclick="toggleThemeMenu()">
            <i class="fa-solid fa-palette"></i>
        </button>
        <div class="theme-dropdown" id="themeDropdown">
            <div class="theme-dropdown-header">Theme</div>
            <div class="theme-option" onclick="setTheme('dark')">🌙 Dark <i class="fa-solid fa-circle-dot active-indicator check-dark"></i></div>
            <div class="theme-option" onclick="setTheme('light')">☀️ Light <i class="fa-solid fa-circle-dot active-indicator check-light"></i></div>
            <div class="theme-option" onclick="setTheme('badger')">🦡 Badger <i class="fa-solid fa-circle-dot active-indicator check-badger"></i></div>
            <div class="theme-option" onclick="setTheme('ocean')">🌊 Ocean <i class="fa-solid fa-circle-dot active-indicator check-ocean"></i></div>
        </div>
    </div>

<div class="card">
    <h1>Welcome Back 👋</h1>
    <p class="subtitle">Enter your credentials to access your account.</p>
    
    <div id="error-msg" class="error">Invalid username or password</div>

    <form action="/login" method="post">
        <input type="text" name="username" placeholder="Username" required>
        
        <div class="password-container">
            <input type="password" id="password" name="password" placeholder="Password" required style="padding-right: 40px;">
            <i class="fa fa-eye toggle-password" id="togglePassword"></i>
        </div>

        <div class="remember-me-container">
            <input type="checkbox" id="remember-me" name="remember-me">
            <label for="remember-me">Remember me</label>
        </div>

        <button type="submit">Sign In</button>
    </form>
    
    <a href="register.html">Don't have an account? <span style="color:var(--primary); font-weight:600;">Sign Up</span></a>
</div>

<script>
    // Theme logic
    function toggleThemeMenu() { document.getElementById('themeDropdown').classList.toggle('show'); }
    
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        updateActiveThemeIndicator(theme);
        document.getElementById('themeDropdown').classList.remove('show');
    }

    function updateActiveThemeIndicator(theme) {
        document.querySelectorAll('.active-indicator').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.check-' + theme).forEach(el => el.style.display = 'inline-block');
    }

    window.addEventListener('click', function(e) {
        if (!e.target.closest('.theme-dropdown-container')) {
            const dropdown = document.getElementById('themeDropdown');
            if(dropdown) dropdown.classList.remove('show');
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        updateActiveThemeIndicator(localStorage.getItem('theme') || 'dark');
    });

    // Password Toggle
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    togglePassword.addEventListener('click', function (e) {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.classList.toggle('fa-eye-slash');
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
        document.getElementById('error-msg').style.display = 'block';
    }
</script>

</body>
</html>
