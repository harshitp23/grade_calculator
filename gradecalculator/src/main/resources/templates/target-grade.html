<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Target Grade - GradeCalc</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #111827; --text-muted: #6b7280; --sidebar-width: 260px; --border-color: #e5e7eb; }
        [data-theme="dark"] { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f3f4f6; --text-muted: #94a3b8; --border-color: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); margin: 0; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: var(--sidebar-width); background-color: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 24px; }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 40px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; border-radius: 8px; margin-bottom: 8px; font-weight: 500; }
        .nav-link.active { background-color: rgba(79, 70, 229, 0.1); color: var(--primary); }
        .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 20px; margin-top: auto; }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; }
        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); padding: 25px; margin-bottom: 25px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); margin-bottom: 15px; }
        .btn-calc { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; }
        .result-huge { font-size: 44px; font-weight: 900; color: var(--primary); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i> GradeCalc</div>
        <nav>
            <a th:href="@{/index}" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a th:href="@{/add-subject}" class="nav-link"><i class="fa-solid fa-plus-circle"></i> Add Subject</a>
            <a th:href="@{/simulator}" class="nav-link"><i class="fa-solid fa-flask"></i> Simulator</a>
            <a th:href="@{/target-grade}" class="nav-link active"><i class="fa-solid fa-bullseye"></i> Target Calculator</a>
        </nav>
        <div class="sidebar-footer">
            <div style="display: flex; justify-content: space-around; margin-bottom: 15px;">
                <button onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; color:var(--text-muted);"><i class="fa-solid fa-circle-half-stroke"></i></button>
                <a th:href="@{/settings}" style="color:var(--text-muted);"><i class="fa-solid fa-gear"></i></a>
                <form th:action="@{/logout}" method="post" style="display:inline;"><button type="submit" style="background:none; border:none; cursor:pointer; color:var(--text-muted);"><i class="fa-solid fa-right-from-bracket"></i></button></form>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); text-align: center;">Signed in as <br><strong th:text="${#authentication.name}">User</strong></div>
        </div>
    </aside>

    <main class="main-content">
        <div class="container">
            <h1>Target Grade Calculator 🎯</h1>
            <div class="card">
                <label>In-Progress Subject</label>
                <select id="subSelect" onchange="loadData()">
                    <option value="" disabled selected>Select a course...</option>
                    <th:block th:each="sub : ${subjects}"><option th:value="${sub.id}" th:text="${sub.subjectName}"></option></th:block>
                </select>
                <div id="quickStats" style="display:none; justify-content:space-between; text-align:center;">
                    <div><label>Current</label><div id="cGrade" style="font-weight:800; font-size:18px;">-</div></div>
                    <div><label>System</label><div id="mDisplay" style="font-weight:600;">-</div></div>
                </div>
            </div>
            <div id="inputs" class="card" style="display:none;">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div><label>Goal %</label><input type="number" id="goal" value="90"></div>
                    <div><label>Assignment Points</label><input type="number" id="pts" placeholder="e.g. 100"></div>
                </div>
                <label>Target Category</label><select id="compSelect"></select>
                <button class="btn-calc" onclick="calc()">Calculate</button>
            </div>
            <div id="res" class="card" style="display:none; text-align:center;">
                <div id="finalResult" class="result-huge">0%</div>
                <div id="desc" style="color:var(--text-muted);"></div>
            </div>
        </div>
    </main>

    <script>
        (function() { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); })();
        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t); localStorage.setItem('theme', t);
        }
        let sd = null;
        async function loadData() {
            const res = await fetch(`/api/simulator/load?subjectId=${document.getElementById('subSelect').value}`);
            sd = await res.json();
            document.getElementById('quickStats').style.display = 'flex';
            document.getElementById('inputs').style.display = 'block';
            document.getElementById('cGrade').innerText = (sd.currentScore || 0) + '%';
            const iw = sd.components.some(c => c.weight > 0);
            document.getElementById('mDisplay').innerText = iw ? "Weighted" : "Points";
            const cs = document.getElementById('compSelect'); cs.innerHTML = "";
            sd.components.forEach(c => cs.innerHTML += `<option value="${c.id}">${c.name}</option>`);
        }
        function calc() {
            const g = parseFloat(document.getElementById('goal').value), p = parseFloat(document.getElementById('pts').value);
            const comp = sd.components.find(c => c.id == document.getElementById('compSelect').value);
            const iw = sd.components.some(c => c.weight > 0);
            let n = 0;
            if (iw) {
                let wp = 0; sd.components.forEach(c => { if(c.totalPoints > 0) wp += (c.score/c.totalPoints)*c.weight; });
                const oc = wp - ((comp.score/(comp.totalPoints||1))*comp.weight);
                n = (((g - oc)/comp.weight)*(comp.totalPoints+p) - comp.score)/p*100;
            } else {
                let te=0, tp=0; sd.components.forEach(c => { te+=c.score; tp+=c.totalPoints; });
                n = (((g/100)*(tp+p))-te)/p*100;
            }
            document.getElementById('res').style.display = 'block';
            document.getElementById('finalResult').innerText = n.toFixed(1) + "%";
            document.getElementById('desc').innerText = `You need ${((n/100)*p).toFixed(1)} / ${p} points.`;
        }
    </script>
</body>
</html>
