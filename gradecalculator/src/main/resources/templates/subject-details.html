<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Details - Grade Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #111827; --text-muted: #6b7280; --sidebar-width: 260px; --border-color: #e5e7eb; }
        [data-theme="dark"] { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f3f4f6; --border-color: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); margin: 0; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.02); }
        td { padding: 12px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .component-row { cursor: pointer; font-weight: 600; }
        .assignments-container { display: none; background: rgba(0,0,0,0.02); }
        .toggle-icon { margin-right: 10px; transition: 0.2s; display: inline-block; }
        .active .toggle-icon { transform: rotate(90deg); }
    </style>
    <script>
        (function() { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); })();
        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t); localStorage.setItem('theme', t);
        }
    </script>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="header-row">
                <div>
                    <h1 th:text="${subject.subjectName}">Subject</h1>
                    <div style="color:var(--text-muted)" th:text="${subject.subjectCode}">CODE</div>
                </div>
                <div style="text-align:right">
                    <label>Current Grade</label>
                    <div style="font-size:24px; font-weight:800; color:var(--primary)" th:text="${subject.currentScore + '%'}">0%</div>
                </div>
            </div>
            <div class="card">
                <table>
                    <thead>
                        <tr><th>Component</th><th>Weight</th><th>Score</th><th>%</th></tr>
                    </thead>
                    <tbody>
                        <th:block th:each="comp : ${subject.components}">
                            <tr class="component-row" onclick="toggleAssignments(this)" th:data-drop="${comp.dropLowest}">
                                <td><i class="fa-solid fa-chevron-right toggle-icon"></i> <span th:text="${comp.name}"></span></td>
                                <td th:text="${comp.weight + '%'}"></td>
                                <td class="comp-score-display" th:text="${comp.score + ' / ' + comp.totalPoints}"></td>
                                <td class="comp-percent-display" th:text="${comp.totalPoints > 0 ? (comp.score/comp.totalPoints*100) : 0}"></td>
                            </tr>
                            <tr class="assignments-container">
                                <td colspan="4">
                                    <table style="width:100%">
                                        <tr th:each="assign : ${comp.assignments}">
                                            <td style="padding-left:40px" th:text="${assign.name}"></td>
                                            <td class="score-val" th:text="${assign.score}"></td>
                                            <td class="total-val" th:text="${assign.totalPoints}"></td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </th:block>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script>
        function toggleAssignments(row) {
            row.classList.toggle('active');
            const content = row.nextElementSibling;
            content.style.display = content.style.display === 'table-row' ? 'none' : 'table-row';
        }
    </script>
</body>
</html>
