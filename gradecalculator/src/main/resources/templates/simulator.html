<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulator - GradeCalc</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #4f46e5; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #111827; --text-muted: #6b7280; --sidebar-width: 260px; --border-color: #e5e7eb; --danger: #ef4444; }
        [data-theme="dark"] { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f3f4f6; --text-muted: #94a3b8; --border-color: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); margin: 0; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s ease; }
        
        .sidebar { width: var(--sidebar-width); background-color: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 24px; z-index: 50; transition: transform 0.3s ease; }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-muted); text-decoration: none; border-radius: 8px; margin-bottom: 8px; font-weight: 500; transition: all 0.2s; }
        .nav-link:hover, .nav-link.active { background-color: rgba(79, 70, 229, 0.1); color: var(--primary); }
        .spacer { flex: 1; }
        .user-profile { padding-top: 20px; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .icon-btn { cursor: pointer; color: var(--text-muted); transition: 0.2s; font-size: 16px; background: none; border: none; padding: 5px; }
        .icon-btn:hover { color: var(--primary); }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .selector-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        select { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); flex: 1; font-size: 14px; background: var(--bg-color); color: var(--text-main); }
        .sim-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding: 20px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); }
        .grade-pill { background: var(--primary); color: white; padding: 10px 25px; border-radius: 50px; font-weight: 800; font-size: 22px; }
        .group-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; overflow: hidden; }
        .group-header { padding: 15px 20px; background: rgba(0,0,0,0.02); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .assign-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .assign-input { flex: 1; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main); font-size: 13px; }
        .not-graded { opacity: 0.5; font-style: italic; }

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(2px); align-items: center; justify-content: center; }
        .modal-content { background-color: var(--card-bg); padding: 30px; border-radius: 16px; width: 450px; }
        .btn-save { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; margin-top:10px;}

        .mobile-nav { display: none; }
        .mobile-overlay { display: none; }
        .mobile-close-sidebar { display: none; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .mobile-nav { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
            .sidebar { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); width: 260px; box-shadow: 0 0 15px rgba(0,0,0,0.1); z-index: 999; }
            .sidebar.active { transform: translateX(0); }
            .mobile-close-sidebar { display: block; position: absolute; top: 20px; right: 20px; font-size: 24px; color: var(--text-muted); cursor: pointer; }
            .main-content { padding: 20px; width: 100%; box-sizing: border-box; }
            .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 900; }
            .mobile-overlay.active { display: block; }
        }
    </style>
</head>
<body>

    <div class="mobile-nav">
        <div style="display:flex; align-items:center; gap:15px;">
            <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars" style="font-size:20px;"></i></button>
            <div class="logo" style="margin:0; font-size:18px;"><i class="fa-solid fa-graduation-cap"></i> GradeCalc</div>
        </div>
        <div style="display:flex; gap:15px;">
            <button class="icon-btn" id="themeBtnMobile" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
            <button class="icon-btn" onclick="openGlobalSettings()"><i class="fa-solid fa-gear"></i></button>
            <form th:action="@{/logout}" method="post" style="margin:0;"><button class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></button></form>
        </div>
    </div>

    <div class="mobile-overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar">
        <div class="mobile-close-sidebar" onclick="toggleSidebar()">&times;</div>
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i> GradeCalc</div>
        <nav>
            <a th:href="@{/}" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a th:href="@{/add-subject}" class="nav-link"><i class="fa-solid fa-plus-circle"></i> Add New Subject</a>
            <a th:href="@{/simulator}" class="nav-link active"><i class="fa-solid fa-flask"></i> Grade Simulator</a>
            <a th:href="@{/target-grade}" class="nav-link"><i class="fa-solid fa-bullseye"></i> Target Calculator</a>
        </nav>
        <div class="spacer"></div>
        <div class="user-profile">
            <span style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:5px;">Signed in as <strong sec:authentication="name" style="color:var(--text-main)">Student</strong></span>
            <div style="display:flex; gap:10px;">
                <button class="icon-btn" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
                <button class="icon-btn" onclick="openGlobalSettings()"><i class="fa-solid fa-gear"></i></button>
                <form th:action="@{/logout}" method="post" style="margin:0;"><button class="icon-btn"><i class="fa-solid fa-right-from-bracket"></i></button></form>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="container">
            <h1 style="margin-top:0;">Grade Simulator 🧪</h1>
            <div class="selector-card">
                <select id="subSelect" onchange="loadSimData()">
                    <option value="" disabled selected>Select subject...</option>
                    <th:block th:each="sub : ${subjects}"><option th:value="${sub.id}" th:text="${sub.subjectName}"></option></th:block>
                </select>
            </div>
            
            <div id="simBody" style="display:none;">
                <div class="sim-header">
                    <div>
                        <div id="modeLabel" style="font-size:10px; text-transform:uppercase; color:var(--primary); font-weight:700;">Mode</div>
                        <div id="simStat" style="font-size:14px; color:var(--text-muted);">Testing hypotheticals</div>
                    </div>
                    <div class="grade-pill" id="simPill">0.00%</div>
                </div>
                <div id="groupsArea"></div>
            </div>
        </div>
    </main>

    <div id="globalSettingsModal" class="modal" onclick="if(event.target.id==='globalSettingsModal') this.style.display='none'">
        <div class="modal-content">
            <div class="modal-header"><h2 class="modal-title">Account Settings</h2><span style="cursor:pointer" onclick="document.getElementById('globalSettingsModal').style.display='none'">&times;</span></div>
            <div style="margin-bottom:15px;"><label>Canvas API Token</label><input type="text" id="canvasApiToken" readonly style="width:100%; padding:10px; border-radius:8px; background:var(--bg-color); color:var(--text-main); margin-top:5px;"><button class="btn-save" onclick="resetCanvasToken()">Regenerate Token</button></div>
            <button class="btn-save" style="background:#fee2e2; color:#991b1b; border:1px solid #fecaca" onclick="confirm('Are you sure?')">Delete Account</button>
        </div>
    </div>

    <script>
        function toggleSidebar() { document.querySelector('.sidebar').classList.toggle('active'); document.querySelector('.mobile-overlay').classList.toggle('active'); }
        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); updateIcons(false); }
            else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); updateIcons(true); }
        }
        function updateIcons(isDark) {
            const icon = isDark ? 'fa-sun' : 'fa-moon';
            document.getElementById('themeBtn').querySelector('i').className = `fa-solid ${icon}`;
            document.getElementById('themeBtnMobile').querySelector('i').className = `fa-solid ${icon}`;
        }
        if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); updateIcons(true); }
        function openGlobalSettings() { document.getElementById('globalSettingsModal').style.display = 'flex'; loadCanvasToken(); }
        async function loadCanvasToken() { const r = await fetch('/api/account/token'); const d = await r.json(); document.getElementById('canvasApiToken').value = d.token; }
        async function resetCanvasToken() { const r = await fetch('/api/account/token/reset', {method:'POST'}); const d = await r.json(); document.getElementById('canvasApiToken').value = d.token; }

        let cs = null;
        async function loadSimData() {
            const res = await fetch(`/api/simulator/load?subjectId=${document.getElementById('subSelect').value}`);
            cs = await res.json();
            document.getElementById('simBody').style.display = 'block';
            render();
        }
        function render() {
            const area = document.getElementById('groupsArea'); area.innerHTML = "";
            cs.components.forEach((comp, idx) => {
                const card = document.createElement('div'); card.className = 'group-card';
                card.innerHTML = `<div class="group-header"><span>${comp.name}</span><span>${comp.weight > 0 ? comp.weight+'%' : 'Points'}</span></div>
                                  <div id="g-${idx}" style="padding:20px;"></div>`;
                area.appendChild(card);
                comp.assignments.forEach(a => {
                    const row = document.createElement('div'); row.className = 'assign-row';
                    if(a.score === 0) row.classList.add('not-graded');
                    row.innerHTML = `<input type="text" class="assign-input" value="${a.name}">
                                     <input type="number" class="assign-input" style="flex:0.4; text-align:center;" value="${a.score}" oninput="this.closest('.assign-row').setAttribute('data-mod','true'); this.closest('.assign-row').classList.remove('not-graded'); calc();">
                                     <input type="number" class="assign-input" style="flex:0.3; text-align:center; opacity:0.6;" value="${a.totalPoints}" readonly>`;
                    card.querySelector('div[id^="g-"]').appendChild(row);
                });
            });
            calc();
        }
        function calc() {
            let iw = cs.components.some(c => c.weight > 0), tw = 0, ws = 0, te = 0, tp = 0;
            cs.components.forEach((comp, idx) => {
                const rows = Array.from(document.getElementById(`g-${idx}`).querySelectorAll('.assign-row'));
                let valid = rows.map(r => {
                    const inputs = r.querySelectorAll('input');
                    const s = parseFloat(inputs[1].value), t = parseFloat(inputs[2].value);
                    if(isNaN(s) || isNaN(t) || t === 0 || (s === 0 && r.getAttribute('data-mod') !== 'true')) return null;
                    return { s, t, p: s/t };
                }).filter(x => x);
                let gs = 0, gt = 0; valid.forEach(v => { gs += v.s; gt += v.t; });
                if(gt > 0) {
                    if(iw) { ws += (gs/gt)*comp.weight; tw += comp.weight; }
                    else { te += gs; tp += gt; }
                }
            });
            let f = iw ? (tw > 0 ? (ws/tw)*100 : 0) : (tp > 0 ? (te/tp)*100 : 0);
            document.getElementById('simPill').innerText = f.toFixed(2) + '%';
            document.getElementById('modeLabel').innerText = iw ? "Weighted" : "Points";
        }
    </script>
</body>
</html>
